    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // 1. Has this user already decided?
      var stored = null;
      try {
        stored = localStorage.getItem('cookie_consent');
      } catch (e) {
        /* localStorage can throw in strict privacy modes */
      }

      // 2. If not, detect region via timezone
      var isEuUk = false;
      try {
        var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
        isEuUk = tz.indexOf('Europe/') === 0;
      } catch (e) {
        /* Intl can throw on very old browsers; treat as EU for safety */
        isEuUk = true;
      }

      // 3. Decide analytics_storage
      var analyticsStorage = 'denied';
      if (stored === 'granted') {
        analyticsStorage = 'granted';
      } else if (stored === 'denied') {
        analyticsStorage = 'denied';
      } else if (!isEuUk) {
        // First visit, not EU/UK → auto-grant, no banner needed
        analyticsStorage = 'granted';
        try {
          localStorage.setItem('cookie_consent', 'granted');
        } catch (e) {
          /* ignore */
        }
      }
      // else: first visit, EU/UK → stays 'denied', banner will appear

      // 4. Apply consent, then start GA4
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: analyticsStorage,
      });

      gtag('js', new Date());
      gtag('config', 'G-R57TLFVRW6');
    </script>
